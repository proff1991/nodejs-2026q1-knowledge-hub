services:
  db:
    image: postgres:16-alpine
    container_name: knowledge-hub-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - knowledge-hub-network

  vectordb:
    image: qdrant/qdrant:latest
    container_name: knowledge-hub-vectordb
    restart: unless-stopped
    ports:
      - '6333:6333'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "bash -c '</dev/tcp/127.0.0.1/6333'"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - knowledge-hub-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: knowledge-hub:latest
    container_name: knowledge-hub-app
    restart: on-failure
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
      RAG_VECTOR_DB_URL: http://vectordb:6333
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - knowledge-hub-network

  adminer:
    image: adminer
    container_name: knowledge-hub-adminer
    restart: unless-stopped
    profiles:
      - debug
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - knowledge-hub-network

volumes:
  postgres_data:
  qdrant_data:

networks:
  knowledge-hub-network:
    driver: bridge